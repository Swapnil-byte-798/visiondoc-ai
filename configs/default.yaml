# ===========================================================================
# VisionDoc AI — default configuration
# Backbone : Qwen/Qwen2.5-VL-3B-Instruct   (open-source VLM, preferred)
# Dataset  : DocVQA (lmms-lab/DocVQA)       (document visual question answering)
# Task     : LoRA fine-tuning for document QA + structured field extraction
#
# This file is the single source of truth for a run. Every field maps 1:1 to a
# dataclass in configs/config.py; unknown keys are rejected at load time.
# ===========================================================================
name: visiondoc-ai
seed: 42
device: auto              # auto -> cuda > mps > cpu (see utils/device.py)
output_root: outputs
report_dir: reports

model:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  model_type: qwen2_5_vl
  processor_id: null
  torch_dtype: bfloat16
  attn_implementation: sdpa   # portable; switch to flash_attention_2 on CUDA
  trust_remote_code: true
  load_in_4bit: false         # set true for QLoRA on a small GPU (needs CUDA)
  load_in_8bit: false
  min_pixels: 200704          # 256 * 28 * 28
  max_pixels: 1003520         # 1280 * 28 * 28  (caps VRAM on large scans)

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  # Attention + MLP projections of the Qwen2.5 language decoder only.
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: null

data:
  dataset_name: docvqa
  dataset_id: lmms-lab/DocVQA
  dataset_subset: DocVQA
  image_size: 1024
  max_seq_length: 1024
  train_split: train
  val_split: validation
  test_split: test
  val_fraction: 0.1
  test_fraction: 0.1
  cache_dir: data/cache
  raw_dir: data/raw
  processed_dir: data/processed
  num_workers: 4
  augment: true
  max_train_samples: null     # set e.g. 500 for a quick smoke run
  max_eval_samples: null

training:
  output_dir: outputs/qwen2_5vl-docvqa-lora
  num_train_epochs: 3.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_anls
  greater_is_better: true
  early_stopping_patience: 3
  early_stopping_threshold: 0.0
  resume_from_checkpoint: null
  report_to: wandb
  run_name: qwen2_5vl-docvqa-lora
  dataloader_num_workers: 4
  seed: 42

inference:
  adapter_path: null          # set to outputs/.../adapter after training
  max_new_tokens: 128
  do_sample: false
  temperature: 0.7
  top_p: 0.9
  num_beams: 1
  batch_size: 4
  return_attention: false
  confidence_method: seq_prob
