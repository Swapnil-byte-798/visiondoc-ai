# ===========================================================================
# VisionDoc AI — Qwen2.5-VL on CORD (receipt structured extraction)
# Smaller images + shorter sequences => faster iteration than DocVQA.
# Only fields that differ from configs/default.yaml need to be tuned; the rest
# fall back to the dataclass defaults.
# ===========================================================================
name: visiondoc-ai-cord
seed: 42
device: auto

model:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  model_type: qwen2_5_vl
  torch_dtype: bfloat16
  attn_implementation: sdpa
  max_pixels: 802816          # 1024 * 28 * 28 — receipts are small

data:
  dataset_name: cord
  dataset_id: naver-clova-ix/cord-v2
  dataset_subset: null
  image_size: 768
  max_seq_length: 768
  train_split: train
  val_split: validation
  test_split: test
  augment: true

training:
  output_dir: outputs/qwen2_5vl-cord-lora
  num_train_epochs: 5.0
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  metric_for_best_model: eval_f1
  run_name: qwen2_5vl-cord-lora

inference:
  max_new_tokens: 256         # structured JSON output is longer
